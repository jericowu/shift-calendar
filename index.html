<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>我的排班月曆</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#1d2939;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:24px 14px 60px}header,.toolbar,.stats,.legend,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:20px}h1{font-size:25px;margin:0}small,.muted{color:#667085}.panel{background:white;border:1px solid #e5e9f0;border-radius:18px;padding:18px;box-shadow:0 4px 18px #18223008}.toolbar{justify-content:space-between;margin-bottom:16px}.month{font-size:21px;font-weight:750;min-width:145px;text-align:center}button,select{font:inherit;border:1px solid #d0d5dd;border-radius:10px;background:white;padding:9px 12px;cursor:pointer;color:#344054}button:hover{background:#f2f4f7}button:focus-visible,.day:focus-visible{outline:3px solid #84caff;outline-offset:2px}.primary{background:#175cd3;color:white;border-color:#175cd3}.primary:hover{background:#1849a9}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:15px 0}.stat{padding:15px;background:#fff;border:1px solid #e5e9f0;border-radius:14px}.stat b{display:block;font-size:23px;margin-top:4px}.legend{margin:15px 0;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.early{background:#dcecff}.late{background:#e3f2d4}.holidaylate{background:#ffebca}.off{background:#eef0f3}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:13px;color:#667085;padding:10px 0;font-weight:700}.weekday:first-child,.weekday:last-child{color:#d92d20}.day{position:relative;min-height:99px;padding:9px 7px;border-radius:11px;border:1px solid #e5e9f0;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}.day.empty{background:#fafafa;cursor:default;border-color:transparent}.day.today{outline:2px solid #175cd3;outline-offset:-2px}.day .number{font-weight:750;font-size:15px}.day .name{font-size:13px;font-weight:750}.day .hours{font-size:12px;line-height:1.4}.day.early{background:#dcecff}.day.late{background:#e3f2d4}.day.holidaylate{background:#ffebca}.day.off{background:#eef0f3}.day:not(.empty):hover{filter:brightness(.97)}.quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border-radius:12px;padding:12px;margin:12px 0}.quick button.active{border-color:#175cd3;background:#eff8ff;color:#175cd3;font-weight:700}.actions{margin-top:18px}dialog{border:0;border-radius:18px;padding:0;max-width:360px;width:calc(100% - 32px);box-shadow:0 20px 70px #10182844}dialog::backdrop{background:#10182877}.dialog-inner{padding:22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.choices button{padding:15px 8px;font-weight:700}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.hint{font-size:13px;color:#667085;margin-top:15px;line-height:1.7}@media(max-width:600px){.app{padding:16px 9px 45px}.panel{padding:11px}.day{min-height:77px;padding:6px 3px;gap:4px}.day .number{font-size:13px}.day .name{font-size:12px}.day .hours{font-size:10px;overflow-wrap:anywhere}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:19px}.month{font-size:18px;min-width:115px}header h1{font-size:21px}.toolbar{gap:6px}.toolbar button{padding:8px}}
 .authbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.status{font-size:13px;color:#475467}.warning{padding:12px;border-radius:12px;background:#fff7e6;color:#7a4b00;margin-bottom:14px}.hidden{display:none!important}button:disabled{opacity:.5;cursor:not-allowed} </style></head><body><main class="app"><header><div><h1>📅 我的排班月曆</h1><small>簡單記錄每一天的上班時間</small></div><button id="todayBtn">回到今天</button></header><div class="authbar"><button id="login" class="primary">使用 Google 登入</button><button id="logout" class="hidden">登出</button><span id="status" class="status">尚未連線</span></div><div id="setup" class="warning">尚未設定 Firebase。請先依 README 步驟設定 firebase-config.js。</div><div id="migration" class="warning hidden">偵測到這台瀏覽器的舊排班。<button id="migrate">將舊排班匯入雲端</button>（僅新增雲端尚未存在的日期）</div><section class="panel"><div class="toolbar"><button id="prev" aria-label="上個月">←</button><div id="month" class="month"></div><button id="next" aria-label="下個月">→</button></div><div class="legend"><span><i class="dot early"></i>早班 10:00–19:00</span><span><i class="dot late"></i>晚班 13:00–22:00</span><span><i class="dot holidaylate"></i>假晚 13:30–22:30</span><span><i class="dot off"></i>休假</span></div><div class="quick"><b>快速排班：</b><button data-quick="early">早班</button><button data-quick="late">晚班</button><button data-quick="holidaylate">假晚</button><button data-quick="off">休假</button><button data-quick="clear">清除</button><button id="normalMode" class="active">一般模式</button></div><div id="calendar" class="calendar" aria-label="排班月曆"></div></section><div class="stats"><div class="stat"><small>上班天數</small><b id="workDays">0 天</b></div><div class="stat"><small>休假天數</small><b id="offDays">0 天</b></div><div class="stat"><small>排班總時數</small><b id="workHours">0 小時</b></div></div><div class="actions"><button id="export">⬇ 匯出備份</button><button id="import">⬆ 匯入備份</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="hint">登入後資料會儲存在 Firebase，並同步到其他登入同一帳號的裝置。未登入時不可修改。統計為班表時間跨度，尚未扣除休息時間。</p></main><dialog id="editor"><div class="dialog-inner"><h2 id="editDate" style="margin:0"></h2><p class="muted">選擇當天的班別</p><div class="choices"><button class="early" data-set="early">早班<br><small>10:00–19:00</small></button><button class="late" data-set="late">晚班<br><small>13:00–22:00</small></button><button class="holidaylate" data-set="holidaylate">假晚<br><small>13:30–22:30</small></button><button class="off" data-set="off">休假</button></div><div class="dialog-actions"><button data-set="clear">清除排班</button><button id="close">取消</button></div></div></dialog><script src="firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,collection,onSnapshot,setDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const KEY='wei-shift-calendar-v1', shifts={early:{name:'早班',time:'10:00–19:00',hours:9},late:{name:'晚班',time:'13:00–22:00',hours:9},holidaylate:{name:'假晚',time:'13:30–22:30',hours:9},off:{name:'休假',time:'',hours:0}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const valid=(k,v)=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Object.hasOwn(shifts,v);
let legacy={};try{const obj=JSON.parse(localStorage.getItem(KEY)||'{}');if(obj&&typeof obj==='object'&&!Array.isArray(obj))for(const [k,v] of Object.entries(obj))if(valid(k,v))legacy[k]=v}catch{}
let data={},user=null,db=null,auth=null,unsubscribe=null,ready=false,quick=null,selected='';
const now=new Date(),today=()=>new Date();let year=now.getFullYear(),month=now.getMonth();
const dateKey=d=>`${year}-${pad(month+1)}-${pad(d)}`;
function status(msg){$('status').textContent=msg}
function canEdit(){if(!user||!ready){alert('請先登入並等待雲端同步完成');return false}return true}
function render(){
 $('month').textContent=`${year} 年 ${month+1} 月`;const cal=$('calendar');cal.replaceChildren();
 '日一二三四五六'.split('').forEach(x=>{const e=document.createElement('div');e.className='weekday';e.textContent=x;cal.append(e)});
 const offset=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
 for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}
 let work=0,off=0,hours=0;
 for(let d=1;d<=count;d++){
  const key=dateKey(d),type=data[key],s=shifts[type],b=document.createElement('button');b.type='button';b.className='day'+(s?' '+type:'');
  const current=today();if(year===current.getFullYear()&&month===current.getMonth()&&d===current.getDate())b.classList.add('today');
  const n=document.createElement('span');n.className='number';n.textContent=d;b.append(n);
  if(s){const name=document.createElement('span');name.className='name';name.textContent=s.name;b.append(name);if(s.time){const t=document.createElement('span');t.className='hours';t.textContent=s.time.replace('–','\n');t.style.whiteSpace='pre-line';b.append(t);work++;hours+=s.hours}else off++}
  b.setAttribute('aria-label',`${key} ${s?s.name+' '+s.time:'未排班'}`);
  b.onclick=()=>{if(!canEdit())return;selected=key;if(quick)apply(quick);else{$('editDate').textContent=`${year} 年 ${month+1} 月 ${d} 日`;$('editor').showModal()}};cal.append(b);
 }
 $('workDays').textContent=work+' 天';$('offDays').textContent=off+' 天';$('workHours').textContent=hours+' 小時';
}
async function apply(type){if(!canEdit())return;const key=selected;const before=data[key];if(type==='clear')delete data[key];else data[key]=type;render();$('editor').close();try{await setDoc(doc(db,'users',user.uid,'shifts',key),{type:type==='clear'?null:type,updatedAt:Date.now()});status('已同步至雲端')}catch(e){if(before===undefined)delete data[key];else data[key]=before;render();alert('儲存失敗：'+e.message);status('同步失敗')}}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('todayBtn').onclick=()=>{const d=today();year=d.getFullYear();month=d.getMonth();render()};
document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>apply(b.dataset.set));$('close').onclick=()=>$('editor').close();
const quickButtons=[...document.querySelectorAll('[data-quick]')];function setQuick(v){quick=v;quickButtons.forEach(b=>b.classList.toggle('active',b.dataset.quick===v));$('normalMode').classList.toggle('active',v===null)}quickButtons.forEach(b=>b.onclick=()=>setQuick(b.dataset.quick));$('normalMode').onclick=()=>setQuick(null);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,shifts:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的排班備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>{if(canEdit())$('file').click()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const raw=JSON.parse(await f.text()),incoming=raw.shifts;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('格式不正確');const clean={};for(const [k,v] of Object.entries(incoming))if(valid(k,v))clean[k]=v;if(!confirm(`將匯入 ${Object.keys(clean).length} 筆排班，覆蓋同日期的雲端班別（不刪除其他日期）。確定嗎？`))return;await upload(clean);alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
async function upload(entries){if(!canEdit())return;const items=Object.entries(entries);for(let i=0;i<items.length;i+=400){const batch=writeBatch(db);for(const [key,type] of items.slice(i,i+400))batch.set(doc(db,'users',user.uid,'shifts',key),{type,updatedAt:Date.now()});await batch.commit()}}
$('migrate').onclick=async()=>{if(!canEdit())return;const missing=Object.fromEntries(Object.entries(legacy).filter(([k])=>!(k in data)));if(!Object.keys(missing).length){$('migration').classList.add('hidden');return}if(!confirm(`要將 ${Object.keys(missing).length} 筆舊排班加入雲端嗎？`))return;try{await upload(missing);$('migration').classList.add('hidden');alert('舊資料已匯入雲端')}catch(e){alert('匯入失敗：'+e.message)}};
render();
const cfg=window.FIREBASE_CONFIG;
if(!cfg||!cfg.apiKey||cfg.apiKey.includes('請填入')){status('請先完成 Firebase 設定');$('login').disabled=true}
else{
 try{
  const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);$('setup').classList.add('hidden');
  $('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked')await signInWithRedirect(auth,new GoogleAuthProvider());else alert('登入失敗：'+e.message)}};
  $('logout').onclick=()=>signOut(auth);
  getRedirectResult(auth).catch(e=>status('登入返回失敗：'+e.message));
  onAuthStateChanged(auth,u=>{
   if(unsubscribe){unsubscribe();unsubscribe=null}user=u;ready=false;data={};render();
   $('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('migration').classList.add('hidden');
   if(!u){status('尚未登入，請使用 Google 帳號登入');return}
   status(`已登入：${u.email||'Google 使用者'} · 同步中`);
   unsubscribe=onSnapshot(collection(db,'users',u.uid,'shifts'),snapshot=>{
    const fresh={};snapshot.forEach(record=>{const type=record.data().type;if(valid(record.id,type))fresh[record.id]=type});data=fresh;ready=true;render();status(`已登入：${u.email||'Google 使用者'} · 雲端已同步`);
    if(Object.keys(legacy).some(k=>!(k in data)))$('migration').classList.remove('hidden');
   },e=>{ready=false;status('雲端讀取失敗：'+e.message)});
  });
 }catch(e){status('Firebase 初始化失敗：'+e.message)}
}
</script></body></html>
